name: Auto update vessel data every 15 minutes

on:
  schedule:
    # Setiap 15 menit pada menit 7, 22, 37, dan 52.
    # Offset dipakai agar tidak tepat pada awal jam.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: automatic-smart-vessel-update
  cancel-in-progress: false

jobs:
  update-vessel-data:
    name: Automatic vessel data update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate latest data.json
        run: |
          python parser.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          file_path = Path("data.json")

          if not file_path.exists():
              raise Exception(
                  "data.json tidak berhasil dibuat."
              )

          with file_path.open(
              "r",
              encoding="utf-8"
          ) as file:
              payload = json.load(file)

          records = payload.get("records")
          last_update = payload.get("lastUpdate")

          if not isinstance(records, list):
              raise Exception(
                  "records pada data.json bukan list."
              )

          if len(records) == 0:
              raise Exception(
                  "Parser menghasilkan 0 vessel. "
                  "Update dibatalkan agar data lama tetap aman."
              )

          if not last_update:
              raise Exception(
                  "lastUpdate tidak ditemukan."
              )

          print("=" * 60)
          print("VALIDASI DATA BERHASIL")
          print("=" * 60)
          print("Last update :", last_update)
          print("Total vessel:", len(records))
          PY

      - name: Commit and push latest data
        run: |
          git config user.name "smart-vessel-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada data.json."
            exit 0
          fi

          git commit -m "Automatic vessel data update"

          git pull --rebase origin main
          git push origin main
